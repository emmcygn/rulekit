# rulekit extraction eval — recorded responses by default.
#
#   npm run build && npx promptfoo eval -c evals/promptfooconfig.yaml
#   (or just: npm run eval)
#
# This provider makes no live model calls and needs no API key. It serves
# the committed responses in evals/recorded/. For a live run against the real
# model, see promptfooconfig.live.yaml and evals/README.md.
# npm run eval applies promptfoo's supported opt-outs; see evals/README.md for
# the upstream opt-out notification that prevents a no-network guarantee.
description: rulekit facts compiler — 10-note synthetic regression fixture (recorded responses; not statistical confidence)

prompts:
  # The versioned prompt file, rendered through the production renderer.
  - id: file://prompt.js
    label: extract-facts.v1

providers:
  - id: file://providers/recorded.js
    label: recorded/claude-opus-5

tests: file://tests.js

defaultTest:
  options:
    # Nothing here is model-graded — every assertion is deterministic code.
    # An LLM judge would put a second unreviewed model in the loop, which is
    # the thing this project exists to argue against.
    provider: null
