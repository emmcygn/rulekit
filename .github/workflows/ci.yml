name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dogfood

      # Dogfood the facts CLI over the shipped corpus: schema, quote grounding
      # re-verified against corpus/notes/ (including that each quote comes from
      # the cited patient's own chart), and recency windows.
      #
      # These three gates live here, in the root job, because the scripts they
      # invoke are declared in the ROOT package.json — web/ is a separate package
      # with its own scripts, and running them from web/ fails with "missing
      # script" no matter how healthy the code is.
      - run: npm run facts:check

      # The extraction eval, twice over. Both are offline — the recorded
      # responses in evals/recorded/ are committed, no API key exists here, and
      # neither step makes a network call.
      #   promptfoo:  per-case pass/fail, exits 100 on a regression
      #   facts eval: corpus-level precision/recall floors
      - run: npm run eval
      - run: npm run facts:eval

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # web/ is its own package, but it builds against the repo around it: the
      # engine (src/core) and the demo data it bundles rather than copies
      # (rules/trials/demo-hf-001, packs/trials, fixtures/patients). Renaming or
      # deleting any of those breaks this job — that is the intended guard.
      # src/core's own deps (zod, yaml) live in the ROOT node_modules, so the
      # root install comes first.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npm run build

  review-pane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-components/review-pane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  walkthrough:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/clinic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # Build FIRST, and not only to prove it builds. tests/budget.test.js reads
      # dist/assets/ for its 250KB gzip ceiling and SKIPS ITSELF IN SILENCE when
      # there is no dist/ — tests before a build would go green having proved
      # nothing about bundle size. The build also runs scripts/sync-plain.mjs,
      # which reads ../plain.html (docs/plain.html, the essay's source of truth)
      # and writes the public/ copy that the sync and parity tests read back.
      - run: npm run build
      - run: npx vitest run
      # Copy parity: every sentence in the 3D panels must still appear verbatim
      # in the docs/plain.html section it was transplanted from, and the
      # claims-discipline labels ("synthetic", the 56.7% heuristic caveat, the
      # not-medical-software notice) must survive somewhere a phone renders.
      - run: npm run parity
      # `npm run smoke` is deliberately absent. It drives the built bundle in a
      # real browser through puppeteer-core and needs a local Chrome this runner
      # does not have. It stays a pre-merge local gate: `npm run verify`.
