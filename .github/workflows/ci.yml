name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dogfood

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # web/ is its own package, but it builds against the repo around it: the
      # engine (src/core) and the demo data it bundles rather than copies
      # (rules/trials/demo-hf-001, packs/trials, fixtures/patients). Renaming or
      # deleting any of those breaks this job — that is the intended guard.
      - run: npm ci
      - run: npm test
      - run: npm run build
