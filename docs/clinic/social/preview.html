<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>medirulekit workflow preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 627px; overflow: hidden;
      background: #f4f6f8; color: #1a1d21; font-family: 'Public Sans', Arial, sans-serif; }
    main { position: relative; width: 100%; height: 100%; }
    .copy { position: absolute; inset: 42px auto 40px 48px; width: 628px; }
    .brand { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.8px; }
    .brand::before { content: ''; display: inline-block; width: 16px; height: 16px;
      margin-right: 12px; background: #793843; }
    h1 { margin: 22px 0 0; font-size: 27px; line-height: 1.3;
      font-weight: 600; letter-spacing: -.65px; }
    .workflow { position: absolute; top: 134px; left: 0; width: 628px; height: 344px; overflow: visible; }
    .node-title { font-size: 21px; font-weight: 600; fill: #1a1d21; }
    .node-detail { font-size: 17px; fill: #585f66; }
    .engine-title { fill: #fff; font-size: 23px; font-weight: 600; }
    .engine-detail { fill: #d8dee4; font-size: 17px; }
    .footer { position: absolute; bottom: 0; left: 0; }
    .invite { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    .scope { margin: 0; color: #585f66; font-size: 15px; }
    .product { position: absolute; top: 62px; right: 44px; width: 438px; height: 498px;
      margin: 0; overflow: hidden; border: 1px solid #d8dee4; border-radius: 8px;
      background: #fff; box-shadow: 0 16px 40px #1a1d2112; }
    .product figcaption { display: flex; align-items: center; height: 40px; padding: 0 16px;
      border-bottom: 1px solid #d8dee4; color: #585f66; font-size: 13px; background: #fff; }
    .product img { display: block; width: 100%; height: auto; }
    .product-note { position: absolute; right: 44px; bottom: 40px; width: 438px;
      margin: 0; color: #585f66; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <p class="brand">medirulekit</p>
      <h1>Human review. Deterministic execution.</h1>
      <svg class="workflow" viewBox="0 0 628 344" role="img" aria-label="Human-authored rules feed a deterministic medical rule engine. Agent fact proposals pass through human review before entering the same engine.">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#793843"/>
          </marker>
        </defs>
        <g fill="none" stroke="#793843" stroke-width="2.5" marker-end="url(#arrow)">
          <path d="M 238 60 H 310"/>
          <path d="M 238 276 H 310"/>
          <path d="M 464 216 V 140"/>
        </g>
        <text x="479" y="184" font-size="14" fill="#793843">Confirmed facts</text>

        <rect x="0" y="0" width="238" height="120" rx="8" fill="#fff" stroke="#d8dee4"/>
        <rect x="0" y="0" width="5" height="120" rx="2" fill="#78838f"/>
        <text class="node-title" x="22" y="38">Rule authoring</text>
        <text class="node-detail" x="22" y="70">Protocol wording</text>
        <text class="node-detail" x="22" y="96">Versioned YAML</text>

        <rect x="316" y="0" width="292" height="134" rx="8" fill="#1a1d21"/>
        <text class="engine-title" x="338" y="39">Medical rule engine</text>
        <text class="engine-detail" x="338" y="71">Deterministic evaluation</text>
        <path d="M 338 88 H 586" stroke="#585f66"/>
        <text class="engine-detail" x="338" y="114">Pass · Fail · Unknown</text>

        <rect x="0" y="216" width="238" height="120" rx="8" fill="#fff" stroke="#d8dee4"/>
        <rect x="0" y="216" width="5" height="120" rx="2" fill="#793843"/>
        <text class="node-title" x="22" y="254">Agents</text>
        <text class="node-detail" x="22" y="286">Fact proposals</text>
        <text class="node-detail" x="22" y="312">Source quotes</text>

        <rect x="316" y="216" width="292" height="120" rx="8" fill="#fff" stroke="#793843" stroke-width="1.5"/>
        <text class="node-title" x="338" y="258">Human review</text>
        <text class="node-detail" x="338" y="290">Confirm, edit or reject</text>
        <text class="node-detail" x="338" y="316">Evidence stays visible</text>
      </svg>
      <div class="footer">
        <p class="invite">Explore the interactive walkthrough</p>
        <p class="scope">Open-source prototype · Synthetic data · Clinical trial eligibility</p>
      </div>
    </div>
    <figure class="product">
      <figcaption>Workbench / Amendment review</figcaption>
      <img src="../../images/workbench-amendment.png" alt="RuleKit workbench showing a protocol amendment and changes in synthetic participant results.">
    </figure>
    <p class="product-note">Actual interface, synthetic cohort</p>
  </main>
</body>
</html>
