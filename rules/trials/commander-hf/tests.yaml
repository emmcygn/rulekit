# Rule-set tests for COMMANDER HF (NCT01877915).
#
# Every modelled criterion is exercised in both directions, and the four
# unmodelled ones are asserted `unknown` so the contract is visible: a
# criterion recorded but not modelled must never resolve to pass or fail.
#
# Verdict semantics under test:
#   inclusion  — pass when the condition is true, fail when false
#   exclusion  — fail when the condition fires (true), pass when it does not
#   any leaf over a missing fact — unknown, propagated by Kleene logic
#   overall    — any fail -> ineligible; else any unknown -> undetermined;
#                else eligible
#
# Note what the unmodelled criteria do to the outcome column: no patient can
# reach `eligible` on structured facts alone, because COMMANDER HF genuinely
# requires chart review (the index event, medical stability, bleeding risk,
# planned inotropes). `undetermined` is the correct answer, not a gap in the
# tooling.

cases:
  - name: qualifies on every modelled criterion — undetermined, pending chart review
    facts:
      age: 71
      conditions:
        - { code: "88805009", system: snomed, daysAgo: 900 }
        - { code: "53741008", system: snomed, daysAgo: 1200 }
      medications:
        - { code: "316672", system: rxnorm, daysAgo: 30 }
      hf_symptom_duration_months: 18
      lab_lvef: 32
      lab_lvef_days_ago: 60
      lab_nt_probnp: 1200
      index_hospital_days: 6
    expect:
      age-range: pass
      symptomatic-heart-failure: pass
      decompensation-index-event: unknown
      lvef-40-or-below: pass
      significant-coronary-artery-disease: pass
      medically-stable: unknown
      natriuretic-peptide: pass
      bleeding-risk: unknown
      concomitant-disease: pass
      recent-stroke: pass
      index-stay-over-21-days: pass
      overall: undetermined

