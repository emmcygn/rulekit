# Local lab code -> LOINC.
#
# The design spec calls for resolving local codes through the free NLM
# terminology APIs. This build resolves them from this committed file instead.
# Deviation, and why: the pipeline has to be reproducible and runnable with no
# network — CI must not depend on an external service being up, and a corpus
# whose contents change when a remote vocabulary changes is not a fixture.
# Swapping this table for an NLM lookup is a drop-in change to
# scripts/lib/normalize.ts; the table shape is the same.
#
# The `local` codes are invented site-local codes of the kind a hospital lab
# actually uses; the mess injector plants them, this file removes them.
# `XLAB-77` is deliberately absent from the mapping: it is the unresolvable
# code that exercises the quarantine path.

codes:
  - local: CREAT-S
    loinc: 38483-4
    slug: creatinine
